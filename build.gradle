plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// The integration checks in tests/ point the dedicated server at a temporary directory and a local Telegram stub.
def testDirectory = providers.environmentVariable('TELEGRAM_TEST_DIRECTORY')
def testApi = providers.environmentVariable('TELEGRAM_TEST_API')

neoForge {
    version = neo_version

    runs {
        server {
            server()
            programArgument '--nogui'
            if (testDirectory.isPresent()) {
                gameDirectory = file(testDirectory.get())
                systemProperty 'telegramnotificator.apiBase', testApi.getOrElse('')
            }
        }
        configureEach {
            if (!testDirectory.isPresent()) {
                gameDirectory = project.file("run/${name}")
            }
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('runServer', JavaExec).configure {
    standardInput = System.in
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
